$kind: http-request
name: TC-03 Campo obligatorio
method: POST
url: '{{base_url}}/orders'
order: 1000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token_ana}}'
body:
  type: json
  content: |-
    {
      "quantity": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-03 responde 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("TC-03 rechaza la falta de product", function () {
          const body = pm.response.json();
          pm.expect(body.error.code).to.eql("VALIDATION_ERROR");
          const fields = body.error.details.map(function (item) { return item.field; });
          pm.expect(fields).to.include("product");
          pm.expect(body).to.not.have.property("id");
      });

      pm.sendRequest({
          url: pm.variables.get("base_url") + "/orders?page=1&limit=10",
          method: "GET",
          header: {
              Authorization: "Bearer " + pm.variables.get("token_ana")
          }
      }, function (err, res) {
          pm.test("TC-03 no guarda un pedido", function () {
              pm.expect(err).to.eql(null);
              pm.expect(res.code).to.eql(200);
              pm.expect(res.json().total).to.eql(1);
          });
      });
