$kind: http-request
name: TC-12 Verificar efecto final
method: GET
url: '{{base_url}}/orders/{{orderId}}'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{token_ana}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-12 el pedido guardado sigue igual", function () {
          pm.response.to.have.status(200);
          const body = pm.response.json();
          pm.expect(body.status).to.eql("cancelled");
          pm.expect(body.cancelledAt).to.eql(pm.collectionVariables.get("cancelledAt"));
          pm.expect(String(body.events.length)).to.eql(pm.collectionVariables.get("eventCount"));
          const cancellations = body.events.filter(function (event) { return event.type === "cancelled"; });
          pm.expect(cancellations).to.have.lengthOf(1);
          pm.expect(cancellations[0].at).to.eql(pm.collectionVariables.get("cancelledAt"));
          pm.expect(body.product).to.eql("Cafe");
          pm.expect(body.quantity).to.eql(2);
      });
